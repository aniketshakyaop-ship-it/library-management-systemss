    // Helper: calculate fine given due date
    const calculateFine = (dueDateStr, returnDateStr = null) => {
      const due = new Date(dueDateStr);
      const referenceDate = returnDateStr ? new Date(returnDateStr) : new Date();
      // Reset hours to midnight
      due.setHours(0, 0, 0, 0);
      referenceDate.setHours(0, 0, 0, 0);
      const diffTime = referenceDate - due;
      const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
      if (diffDays > 0) {
        return { overdueDays: diffDays, fine: diffDays * 5 }; // ₹5 per day
      }
      return { overdueDays: 0, fine: 0 };
    };

    // Helper: calculate status given due date
    const getBorrowStatus = (borrow) => {
      if (borrow.returnDate) return 'Returned';
      const due = new Date(borrow.dueDate);
      const today = new Date();
      due.setHours(0, 0, 0, 0);
      today.setHours(0, 0, 0, 0);
      const diffDays = Math.ceil((due - today) / (1000 * 60 * 60 * 24));
      if (diffDays < 0) return 'Overdue';
      if (diffDays <= 3) return 'Due Soon';
      return 'Active';
    };

      const [toasts, setToasts] = useState([]);

        return borrows.map(b => {

        });
      }, [borrows]);

      // Notifications (books due soon or overdue)
      const pendingNotifications = useMemo(() => {
        if (persona === 'member') {
          return liveBorrows.filter(b => b.memberId === currentMemberId && !b.returnDate && (b.status === 'Overdue' || b.status === 'Due Soon'));
        } else {
          return liveBorrows.filter(b => !b.returnDate && (b.status === 'Overdue' || b.status === 'Due Soon'));
        }
      }, [liveBorrows, persona]);

      // Filtered Books
      const filteredBooks = useMemo(() => {
        return books.filter(b => {
          const matchesSearch = b.title.toLowerCase().includes(searchQuery.toLowerCase()) ||
            b.author.toLowerCase().includes(searchQuery.toLowerCase()) ||
            b.isbn.includes(searchQuery) ||
            b.tags.some(t => t.toLowerCase().includes(searchQuery.toLowerCase()));

          const matchesCategory = selectedCategory === 'All Categories' || b.category === selectedCategory;

          const matchesAvailability = availabilityFilter === 'all'
            ? true
            : availabilityFilter === 'available'
              ? b.availableCopies > 0
              : b.availableCopies === 0;

          return matchesSearch && matchesCategory && matchesAvailability;
        }).sort((a, b) => {
          if (sortBy === 'title') return a.title.localeCompare(b.title);
          if (sortBy === 'rating') return b.rating - a.rating;
          if (sortBy === 'copies') return b.availableCopies - a.availableCopies;
          if (sortBy === 'year') return b.publishYear - a.publishYear;
          return 0;
        });
      }, [books, searchQuery, selectedCategory, availabilityFilter, sortBy]);

      // Statistics calculations
      const stats = useMemo(() => {
        const totalTitles = books.length;
        const totalCopies = books.reduce((acc, b) => acc + Number(b.totalCopies), 0);
        const availableCopies = books.reduce((acc, b) => acc + Number(b.availableCopies), 0);

        const overdueBorrows = liveBorrows.filter(b => b.status === 'Overdue' && !b.returnDate).length;
        const totalFinesCollected = liveBorrows.reduce((acc, b) => acc + (b.finePaid || 0), 0);
        const pendingFines = liveBorrows.filter(b => !b.returnDate).reduce((acc, b) => acc + (b.currentFine || 0), 0);

        const categoryCounts = {};

        // Top borrowed books
        const borrowCounts = {};

        return {

      // --- ACTIONS ---

      // Issue Book
      const handleIssueBook = ({ bookId, memberId, loanDays = 14 }) => {
        const targetBook = books.find(b => b.id === bookId);
        const targetMember = members.find(m => m.id === memberId);

        if (!targetBook || targetBook.availableCopies <= 0) {
          showToast('Selected book has no available copies in stock!', 'error');
          return;
        }

        // Check active borrow count of member
        const currentActiveCount = liveBorrows.filter(b => b.memberId === memberId && !b.returnDate).length;
        if (currentActiveCount >= targetMember.maxBooksAllowed) {
          showToast(`Limit reached: ${targetMember.name} has already borrowed max ${targetMember.maxBooksAllowed} books.`, 'error');

        const issueDate = new Date().toISOString().split('T')[0];
        const due = new Date();
        due.setDate(due.getDate() + Number(loanDays));
        const dueDate = due.toISOString().split('T')[0];

        const newBorrow = {
          id: `TXN-${Math.floor(1000 + Math.random() * 9000)}`,
          bookId: targetBook.id,
          bookTitle: targetBook.title,
          memberId: targetMember.id,
          memberName: targetMember.name,
          memberRoll: targetMember.rollNo,
          issueDate,
          dueDate,
          returnDate: null,
          status: 'Active',
          finePaid: 0,
          renewCount: 0
        };

        // Update book copies
        setBooks(prev => prev.map(b => b.id === bookId ? { ...b, availableCopies: b.availableCopies - 1 } : b));
        setBorrows(prev => [newBorrow, ...prev]);
        setShowIssueModal(false);
        setPreselectedBookForIssue(null);
        showToast(`Successfully issued "${targetBook.title}" to ${targetMember.name}!`, 'success');
      };

      // Return Book
      const handleReturnBook = (borrowId) => {
        const borrow = liveBorrows.find(b => b.id === borrowId);
        if (!borrow || borrow.returnDate) return;

        const returnDate = new Date().toISOString().split('T')[0];
        const fineInfo = calculateFine(borrow.dueDate, returnDate);

        // Update borrow transaction
        setBorrows(prev => prev.map(b => {
          if (b.id === borrowId) {
            return {
              ...b,
              returnDate,
              status: 'Returned',
              finePaid: fineInfo.fine
            };
          }
          return b;
        }));

        // Restore book copy
        setBooks(prev => prev.map(b => {
          if (b.id === borrow.bookId) {
            return { ...b, availableCopies: Math.min(b.totalCopies, b.availableCopies + 1) };
          }
          return b;
        }));

        const receiptData = {
          ...borrow,
          returnDate,
          finePaid: fineInfo.fine,
          overdueDays: fineInfo.overdueDays
        };

        setReturnReceiptModal(receiptData);
        showToast(`Book "${borrow.bookTitle}" returned successfully!`, 'success');
      };

      // Renew Book (Extend due date by 7 days)
      const handleRenewBook = (borrowId) => {
        setBorrows(prev => prev.map(b => {
          if (b.id === borrowId) {
            const currentDue = new Date(b.dueDate);
            currentDue.setDate(currentDue.getDate() + 7);
            return {
              ...b,
              dueDate: currentDue.toISOString().split('T')[0],
              renewCount: (b.renewCount || 0) + 1
            };
          }
          return b;
        }));
        showToast('Due date extended by 7 days!', 'success');
      };

      // Add or Edit Book
      const handleSaveBook = (bookData) => {
        if (editingBook) {
          // Edit
          setBooks(prev => prev.map(b => b.id === editingBook.id ? { ...bookData, id: b.id } : b));
          showToast(`Updated "${bookData.title}" details.`, 'success');
        } else {
          // Add new
          const newId = `B${String(books.length + 1).padStart(3, '0')}`;
          const newBook = {
            ...bookData,
            id: newId,
            availableCopies: Number(bookData.totalCopies),
            rating: 4.8,
            coverGradient: 'from-indigo-600 to-purple-800',
            tags: bookData.tags || [bookData.category, 'Textbook']
          };
          setBooks(prev => [newBook, ...prev]);
          showToast(`New book "${newBook.title}" added to library catalog!`, 'success');
        }
        setShowAddEditBookModal(false);
        setEditingBook(null);
      };

      const handleDeleteBook = (bookId) => {
        const book = books.find(b => b.id === bookId);
        const hasActiveLoans = liveBorrows.some(b => b.bookId === bookId && !b.returnDate);
        if (hasActiveLoans) {

                    <span className={`font-bold ${returnReceiptModal.finePaid > 0 ? 'text-rose-600' : 'text-emerald-600'}`}>
                      ₹{returnReceiptModal.finePaid}
                    </span>
                  </div>
                </div>

                <div className="flex gap-2">
                  <button
                    onClick={() => window.print()}
                    className="flex-1 py-2 rounded-xl bg-slate-900 hover:bg-slate-800 text-white font-semibold text-xs transition"
                  >
                    🖨️ Print Slip
                  </button>
                  <button
                    onClick={() => setReturnReceiptModal(null)}
                    className="flex-1 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold text-xs"
                  >
                    Done
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* MODAL 5: REGISTER NEW MEMBER (ADMIN) */}
          {showAddMemberModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm">
              <div className="bg-white rounded-3xl max-w-md w-full overflow-hidden shadow-2xl border border-slate-200">
                <div className="p-6 bg-slate-900 text-white flex justify-between items-center">
                  <div>
                    <h3 className="text-lg font-bold">Register New Library Member</h3>
                    <p className="text-xs text-slate-400 mt-0.5">Add student or faculty account</p>
                  </div>
                  <button onClick={() => setShowAddMemberModal(false)} className="text-slate-400 hover:text-white">✕</button>
                </div>

                <form
                  onSubmit={(e) => {
                    e.preventDefault();
                    const formData = new FormData(e.target);
                    handleAddMember({
                      name: formData.get('name'),
                      rollNo: formData.get('rollNo'),
                      department: formData.get('department'),
                      year: formData.get('year'),
                      email: formData.get('email'),
                      phone: formData.get('phone'),
                      role: formData.get('role'),
                      maxBooksAllowed: Number(formData.get('maxBooksAllowed'))
                    });
                  }}
                  className="p-6 space-y-3.5 text-xs"
                >
                  <div>
                    <label className="block font-bold text-slate-700 mb-1">Full Name *</label>
                    <input
                      name="name"
                      required
                      placeholder="e.g. Gazal Gupta"
                      className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-brand-500"
                    />
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">Roll / Staff ID *</label>
                      <input
                        name="rollNo"
                        required
                        placeholder="e.g. 2401090100037"
                        className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-brand-500"
                      />
                    </div>
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">Department *</label>
                      <input
                        name="department"
                        required
                        placeholder="e.g. Computer Science"
                        className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-brand-500"
                      />
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">Year / Position</label>
                      <input
                        name="year"
                        defaultValue="2nd Year"
                        placeholder="e.g. 2nd Year"
                        className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-brand-500"
                      />
                    </div>
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">Role</label>
                      <select
                        name="role"
                        className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-brand-500"
                      >
                        <option value="Student">Student</option>
                        <option value="Faculty">Faculty</option>
                        <option value="Research Scholar">Research Scholar</option>
                      </select>
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">Email Address *</label>
                      <input
                        name="email"
                        type="email"
                        required
                        placeholder="e.g. gazal@acet.ac.in"
                        className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-brand-500"
                      />
                    </div>
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">Max Borrow Limit</label>
                      <input
                        type="number"
                        name="maxBooksAllowed"
                        defaultValue="3"
                        min="1"
                        max="10"
                        className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-brand-500"
                      />
                    </div>
                  </div>

                  <div className="pt-2 flex gap-2">
                    <button
                      type="submit"
                      className="flex-1 py-2.5 rounded-xl bg-brand-600 hover:bg-brand-700 text-white font-semibold transition"
                    >
                      Save & Register
                    </button>
                    <button
                      type="button"
                      onClick={() => setShowAddMemberModal(false)}
                      className="px-4 py-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold"
                    >
                      Cancel
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

        </div>
      );
    }

    // Render application
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
